# AI English Tutor - Docker Compose 配置
# 用于本地开发和生产部署

version: '3.8'

services:
  # API 服务
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-english-tutor-api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data  # SQLite 持久化
      - ./.env:/app/.env:ro  # 配置文件（只读）
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      # ASR/TTS 开关
      - ASR_ENABLED=${ASR_ENABLED:-false}
      - TTS_ENABLED=${TTS_ENABLED:-false}
      # LLM 开关
      - LLM_ENABLED=${LLM_ENABLED:-false}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ai-english-network

  # Web UI 服务（可选）
  ui:
    image: python:3.11-slim
    container_name: ai-english-tutor-ui
    working_dir: /app
    ports:
      - "8501:8501"
    volumes:
      - .:/app
      - ./.env:/app/.env:ro
    command: >
      bash -c "pip install streamlit httpx &&
               streamlit run ui/main.py --server.port 8501 --server.address 0.0.0.0"
    depends_on:
      - api
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    restart: unless-stopped
    networks:
      - ai-english-network

networks:
  ai-english-network:
    driver: bridge
